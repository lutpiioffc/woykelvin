<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💗 KELVIN, AKU MAU BICARA SESUATU...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-bg: #ffe6eb;
            --pink-card: #ffffff;
            --pink-primary: #ff4d79;
            --pink-dark: #d92653;
            --red-alert: #ff1e38;
            --text-main: #2d3748;
            --text-muted: #718096;
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100dvh;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe6eb 50%, #ffccd5 100%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease;
        }

        body.alarm-mode {
            background: linear-gradient(135deg, #3d0007 0%, #1a0003 100%) !important;
            animation: bgFlash 1s infinite alternate;
        }

        @keyframes bgFlash {
            0% { background-color: #3d0007; }
            100% { background-color: #7a0012; }
        }

        /* FLOATING HEARTS BACKGROUND */
        .hearts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart-float {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 4s infinite linear;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* APP CONTAINER */
        .app-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .card {
            background: var(--pink-card);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 77, 121, 0.15);
            border: 2px solid rgba(255, 182, 193, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32,
